<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Calculator</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="calculator.css">
    </head>
    <body class="light-mode">
        <div class="top-section">
            <h2>CALC </h2>
            <button class="toggle-btn"><i id="sunIcon" class="fas fa-sun sun-icon"></i><i id="moonIcon" class="fas fa-moon moon-icon"></i></button>
        </div>
        <div class="screen">
            <input type="text" id="display" readonly style="color: black;">
        </div>
            <div class="buttons">
                <button class="btn clear-btn" style="color: rgb(255, 123, 0);" id="btnId">C</button>
                <button class="btn backspace-btn"><i class="fas fa-backspace"></i></button>
                <button class="btn operator-btns" data-value="%"><i class="fas fa-percent"></i></button>
                <button class="btn operator-btns" data-value="/"><i class="fas fa-divide"></i></button>
                <button class="btn num-btns">7</button>
                <button class="btn num-btns">8</button>
                <button class="btn num-btns">9</button>
                <button class="btn operator-btns" data-value="*"><i class="fas fa-times"></i></button>
                <button class="btn num-btns">4</button>
                <button class="btn num-btns">5</button>
                <button class="btn num-btns">6</button>
                <button class="btn operator-btns" data-value="-"><i class="fas fa-minus"></i></button>
                <button class="btn num-btns">1</button>
                <button class="btn num-btns">2</button>
                <button class="btn num-btns">3</button>
                <button class="btn operator-btns" data-value="+"><i class="fas fa-plus"></i></button>
                <button class="btn sync-btn"><i class="fas fa-sync"></i></button>
                <button class="btn num-btns">0</button>
                <button class="btn num-btns">.</button>
                <button class="btn operator-btns" data-value="="><i class="fas fa-equals"></i></button>
        </div>

        <script src="calculator.js"></script>
    </body>
</html>
